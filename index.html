<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftConvert — Convertisseur de fichiers gratuit | Kayzen Lyon</title>
    <meta name="description" content="Convertissez vos images, audio et vidéos gratuitement dans votre navigateur. Aucun upload serveur, 100% confidentiel. Par Kayzen Lyon." />
    <meta name="author" content="Kayzen Lyon" />
    <link rel="canonical" href="https://swiftconvert.kayzen-lyon.fr" />

    <meta property="og:title" content="SwiftConvert — Convertisseur de fichiers 100% local" />
    <meta property="og:description" content="Convertissez vos fichiers directement dans votre navigateur. Rapide, privé, sans inscription. Zero-Server." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swiftconvert.kayzen-lyon.fr" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kayzen_lyon" />
    <meta name="twitter:title" content="SwiftConvert — Convertisseur Zero-Server" />
    <meta name="twitter:description" content="Convertissez vos fichiers 100% dans votre navigateur. Aucune donnée envoyée." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SwiftConvert",
      "url": "https://swiftconvert.kayzen-lyon.fr",
      "description": "Convertisseur de fichiers gratuit, 100% local. Images, audio et vidéo convertis dans votre navigateur sans aucun envoi serveur.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "creator": {
        "@type": "Organization",
        "name": "Kayzen Lyon",
        "url": "https://www.kayzen-lyon.fr"
      }
    }
    </script>

    <!-- Prevent dark mode flash -->
    <script>
      (function() {
        var stored = localStorage.getItem('vert-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
